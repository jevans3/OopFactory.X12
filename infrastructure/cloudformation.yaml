AWSTemplateFormatVersion: '2010-09-09'
Description: >
  X12-FHIR Translation API - Multi-Tenant SaaS Infrastructure
  Deploys ECS Fargate service with DynamoDB, Secrets Manager, CloudWatch

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for ECS tasks
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for ALB
  ContainerImage:
    Type: String
    Description: ECR image URI (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/x12-fhir-converter:latest)
  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for HTTPS
  DomainName:
    Type: String
    Default: api.x12fhir.example.com

Resources:

  # ─── DynamoDB Tables ─────────────────────────────────────────────────────
  TenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'X12FhirConverter-Tenants-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: ApiKeyHash
          AttributeType: S
      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ApiKeyHash-index
          KeySchema:
            - AttributeName: ApiKeyHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: X12FhirConverter
        - Key: Environment
          Value: !Ref Environment

  TransactionLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'X12FhirConverter-TransactionLog-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: TimestampTxId
          AttributeType: S
      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH
        - AttributeName: TimestampTxId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: X12FhirConverter

  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'X12FhirConverter-AuditLog-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: TimestampRequestId
          AttributeType: S
      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH
        - AttributeName: TimestampRequestId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true  # TTL set to 6 years for HIPAA retention
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Service
          Value: X12FhirConverter

  BillingSummaryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'X12FhirConverter-BillingSummary-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TenantId
          AttributeType: S
        - AttributeName: BillingPeriod
          AttributeType: S
      KeySchema:
        - AttributeName: TenantId
          KeyType: HASH
        - AttributeName: BillingPeriod
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ─── SQS Queue for Async Billing ──────────────────────────────────────────
  BillingEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'x12fhir-billing-events-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600  # 14 days
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BillingEventsDLQ.Arn
        maxReceiveCount: 3

  BillingEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'x12fhir-billing-events-dlq-${Environment}'
      MessageRetentionPeriod: 1209600

  # ─── S3 Bucket for Audit Exports ──────────────────────────────────────────
  AuditExportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'x12fhir-audit-exports-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveAfter90Days
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 90

  # ─── ECS Cluster ───────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'x12fhir-${Environment}'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ─── ECS Task Definition ──────────────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'x12fhir-api-${Environment}'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: x12-fhir-api
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: ASPNETCORE_ENVIRONMENT
              Value: !Ref Environment
            - Name: FhirConverter__AwsRegion
              Value: !Ref AWS::Region
            - Name: FhirConverter__TenantTableName
              Value: !Ref TenantsTable
            - Name: FhirConverter__TransactionLogTableName
              Value: !Ref TransactionLogTable
            - Name: FhirConverter__AuditLogTableName
              Value: !Ref AuditLogTable
            - Name: FhirConverter__BillingSqsQueueUrl
              Value: !Ref BillingEventsQueue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: x12fhir
          HealthCheck:
            Command: ['CMD-SHELL', 'curl -f http://localhost:8080/api/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ─── CloudWatch Log Group ──────────────────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/x12fhir-${Environment}'
      RetentionInDays: 365

  # ─── ALB ───────────────────────────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group for X12-FHIR API
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Tasks Security Group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'x12fhir-${Environment}'
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'x12fhir-tg-${Environment}'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ALBListenerHTTPRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  # ─── ECS Service ───────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListenerHTTPS
    Properties:
      ServiceName: !Sub 'x12fhir-api-${Environment}'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: x12-fhir-api
          ContainerPort: 8080
          TargetGroupArn: !Ref ALBTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100

  # ─── Auto Scaling ──────────────────────────────────────────────────────────
  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: !Ref DesiredCount
      ResourceId: !Sub 'service/${ECSCluster}/${ECSService.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !GetAtt AutoScalingRole.Arn

  AutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: x12fhir-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ─── IAM Roles ─────────────────────────────────────────────────────────────
  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'x12fhir-ecs-execution-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:x12fhir/*'

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'x12fhir-ecs-task-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt TenantsTable.Arn
                  - !Sub '${TenantsTable.Arn}/index/*'
                  - !GetAtt TransactionLogTable.Arn
                  - !GetAtt AuditLogTable.Arn
                  - !GetAtt BillingSummaryTable.Arn
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt BillingEventsQueue.Arn
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: X12FhirConverter
        - PolicyName: S3AuditExport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${AuditExportBucket.Arn}/*'

  AutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'x12fhir-autoscaling-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole

  # ─── CloudWatch Alarms ─────────────────────────────────────────────────────
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'x12fhir-high-error-rate-${Environment}'
      MetricName: 5XXCount
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName

  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'x12fhir-high-latency-${Environment}'
      MetricName: TargetResponseTime
      Namespace: AWS/ApplicationELB
      Statistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 5.0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ALB.LoadBalancerFullName

Outputs:
  ALBDnsName:
    Value: !GetAtt ALB.DNSName
    Description: ALB DNS name for CNAME record
  ECSClusterName:
    Value: !Ref ECSCluster
  ECSServiceName:
    Value: !GetAtt ECSService.Name
  TenantsTableName:
    Value: !Ref TenantsTable
  TransactionLogTableName:
    Value: !Ref TransactionLogTable
  AuditLogTableName:
    Value: !Ref AuditLogTable
  BillingQueueUrl:
    Value: !Ref BillingEventsQueue
