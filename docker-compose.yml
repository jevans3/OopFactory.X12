version: '3.8'

services:
  fhir-converter-api:
    build:
      context: .
      dockerfile: src/OopFactory.X12.FhirConverter.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - FhirConverter__TemplatePath=/app/Templates
      - FhirConverter__ValidateFhirOutput=true
      - FhirConverter__EnableAuditLogging=true
    volumes:
      # Mount custom templates for extension without rebuilding
      - ./custom-templates:/app/Templates/Custom:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    labels:
      - "app.name=davinci-x12-fhir-converter"
      - "app.description=Da Vinci Burden Reduction X12-FHIR Translation API"
      - "app.compliance=CMS-0057-F"
