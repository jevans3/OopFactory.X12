apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: x12-fhir-converter
    app.kubernetes.io/name: x12-fhir-converter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: infor-fhir-platform
    app.kubernetes.io/component: translation-engine
    compliance.hipaa/phi-handler: {{ .Values.complianceLabels.hipaa-phi-handler | quote }}
    compliance.hitrust/scope: {{ .Values.complianceLabels.hitrust-scope | quote }}
    compliance.cms/0057f-compliant: {{ .Values.complianceLabels.cms-0057f-compliant | quote }}
    compliance.davinci/ig-version: {{ .Values.complianceLabels.davinci-ig-version | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: x12-fhir-converter
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: x12-fhir-converter
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: infor-fhir-platform
        compliance.hipaa/phi-handler: {{ .Values.complianceLabels.hipaa-phi-handler | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/api/health"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      containers:
        - name: x12-fhir-converter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: FhirConverter__RequireAuthentication
              value: {{ .Values.config.requireAuthentication | quote }}
            - name: FhirConverter__EnableAuditLogging
              value: {{ .Values.config.enableAuditLogging | quote }}
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: aws-region
            - name: FhirConverter__TenantTableName
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: tenant-table-name
            - name: FhirConverter__TransactionLogTableName
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: transaction-log-table-name
            - name: FhirConverter__AuditLogTableName
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: audit-log-table-name
            - name: FhirConverter__BillingSqsQueueUrl
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: billing-sqs-queue-url
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      terminationGracePeriodSeconds: 30
